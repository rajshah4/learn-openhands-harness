<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Incident Ops</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Operations</p>
        <h1>Incident board</h1>
        <p>Track active work and keep the team moving.</p>
      </header>
      <form id="create-form">
        <label>Title <input name="title" required></label>
        <label>Severity
          <select name="severity">
            <option>P1</option><option>P2</option><option>P3</option><option>P4</option>
          </select>
        </label>
        <button>Create incident</button>
      </form>
      <p id="feedback" role="status"></p>
      <section id="incidents" aria-label="Incidents"></section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
