<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="400" height="450">
  <defs>
    <style>
      @keyframes sway {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(2deg); }
        75% { transform: rotate(-2deg); }
      }
      @keyframes bellows {
        0%, 100% { transform: scaleX(1); }
        50% { transform: scaleX(0.65); }
      }
      @keyframes leftPaw {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(-14px); }
      }
      @keyframes rightPaw {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(14px); }
      }
      @keyframes headBob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2px); }
      }
      @keyframes eyeBlink {
        0%, 92%, 100% { transform: scaleY(1); }
        95% { transform: scaleY(0.1); }
      }
      .sway-group {
        animation: sway 3s ease-in-out infinite;
        transform-origin: 200px 350px;
      }
      .body-sway {
        animation: sway 3s ease-in-out infinite;
        transform-origin: 200px 350px;
      }
      .bellows {
        animation: bellows 1.8s ease-in-out infinite;
        transform-origin: 200px 280px;
      }
      .left-paw {
        animation: leftPaw 1.8s ease-in-out infinite;
      }
      .right-paw {
        animation: rightPaw 1.8s ease-in-out infinite;
      }
      .head-bob {
        animation: headBob 1.8s ease-in-out infinite;
      }
      .eye {
        animation: eyeBlink 3.5s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="400" height="450" fill="#f0e6d3" rx="20"/>

  <!-- Ground shadow -->
  <ellipse cx="200" cy="410" rx="100" ry="15" fill="rgba(0,0,0,0.08)"/>

  <g class="body-sway">
    <!-- Hedgehog body -->
    <ellipse cx="200" cy="340" rx="75" ry="55" fill="#8B5E3C" stroke="#5C3A1E" stroke-width="2.5"/>

    <!-- Spines - back layer -->
    <g fill="#4A2F1A" stroke="#3D2715" stroke-width="1">
      <polygon points="130,310 118,270 145,300"/>
      <polygon points="140,285 130,240 155,278"/>
      <polygon points="155,265 150,218 170,260"/>
      <polygon points="170,250 170,200 185,248"/>
      <polygon points="185,240 190,188 200,240"/>
      <polygon points="200,235 210,182 215,238"/>
      <polygon points="215,240 230,195 230,245"/>
      <polygon points="230,250 250,210 245,258"/>
      <polygon points="245,265 265,225 260,275"/>
      <polygon points="258,280 275,245 270,290"/>
      <polygon points="268,300 282,270 278,308"/>
    </g>

    <!-- Spines - front layer (lighter) -->
    <g fill="#5C3A1E" stroke="#4A2F1A" stroke-width="1">
      <polygon points="160,275 155,230 175,268"/>
      <polygon points="175,255 177,205 190,252"/>
      <polygon points="190,245 198,192 205,243"/>
      <polygon points="205,242 215,190 220,240"/>
      <polygon points="220,245 232,200 235,250"/>
      <polygon points="235,258 248,222 248,262"/>
    </g>

    <!-- Belly -->
    <ellipse cx="200" cy="365" rx="55" ry="30" fill="#D2B48C" stroke="#8B5E3C" stroke-width="1.5"/>

    <!-- Head -->
    <g class="head-bob">
      <ellipse cx="145" cy="315" rx="35" ry="30" fill="#D2B48C" stroke="#8B5E3C" stroke-width="2"/>
      <!-- Snout -->
      <ellipse cx="120" cy="325" rx="18" ry="14" fill="#E8D5B8" stroke="#8B5E3C" stroke-width="1.5"/>
      <!-- Nose -->
      <circle cx="105" cy="322" r="6" fill="#2A1A0E" stroke="#1A0F07" stroke-width="1"/>
      <!-- Eyes -->
      <g class="eye">
        <ellipse cx="138" cy="308" rx="5" ry="6" fill="#1A0F07"/>
        <circle cx="140" cy="306" r="2" fill="white"/>
      </g>
      <!-- Second eye -->
      <g class="eye">
        <ellipse cx="155" cy="306" rx="4.5" ry="5.5" fill="#1A0F07"/>
        <circle cx="157" cy="304" r="1.8" fill="white"/>
      </g>
      <!-- Ear -->
      <ellipse cx="155" cy="288" rx="8" ry="10" fill="#C4A77D" stroke="#8B5E3C" stroke-width="1.5"/>
      <ellipse cx="155" cy="288" rx="5" ry="7" fill="#E8D5B8"/>
      <!-- Smile -->
      <path d="M112,330 Q120,338 132,334" fill="none" stroke="#5C3A1E" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Cheek blush -->
      <ellipse cx="135" cy="328" rx="8" ry="5" fill="rgba(255,150,120,0.35)"/>
    </g>

    <!-- Accordion left side (box) - attached to left side -->
    <g class="left-paw">
      <rect x="62" y="290" width="22" height="80" rx="4" fill="#C0392B" stroke="#8B2222" stroke-width="2"/>
      <rect x="62" y="290" width="22" height="10" rx="3" fill="#E74C3C" stroke="#8B2222" stroke-width="1.5"/>
      <rect x="62" y="360" width="22" height="10" rx="3" fill="#E74C3C" stroke="#8B2222" stroke-width="1.5"/>
      <!-- Buttons on left side -->
      <circle cx="70" cy="305" r="3" fill="#F5D5A0" stroke="#8B2222" stroke-width="0.8"/>
      <circle cx="78" cy="305" r="3" fill="#F5D5A0" stroke="#8B2222" stroke-width="0.8"/>
      <circle cx="70" cy="320" r="3" fill="#F5D5A0" stroke="#8B2222" stroke-width="0.8"/>
      <circle cx="78" cy="320" r="3" fill="#F5D5A0" stroke="#8B2222" stroke-width="0.8"/>
      <circle cx="70" cy="335" r="3" fill="#F5D5A0" stroke="#8B2222" stroke-width="0.8"/>
      <circle cx="78" cy="335" r="3" fill="#F5D5A0" stroke="#8B2222" stroke-width="0.8"/>
      <circle cx="70" cy="350" r="3" fill="#F5D5A0" stroke="#8B2222" stroke-width="0.8"/>
      <circle cx="78" cy="350" r="3" fill="#F5D5A0" stroke="#8B2222" stroke-width="0.8"/>
    </g>

    <!-- Accordion bellows - middle -->
    <g class="bellows">
      <g fill="#E8D5B8" stroke="#C0392B" stroke-width="1">
        <rect x="85" y="295" width="8" height="70" rx="2"/>
        <rect x="98" y="295" width="8" height="70" rx="2"/>
        <rect x="111" y="295" width="8" height="70" rx="2"/>
        <rect x="124" y="295" width="8" height="70" rx="2"/>
        <rect x="137" y="295" width="8" height="70" rx="2"/>
        <rect x="150" y="295" width="8" height="70" rx="2"/>
        <rect x="163" y="295" width="8" height="70" rx="2"/>
        <rect x="176" y="295" width="8" height="70" rx="2"/>
        <rect x="189" y="295" width="8" height="70" rx="2"/>
      </g>
      <!-- Bellows fold lines -->
      <g stroke="#C0392B" stroke-width="1" fill="none">
        <line x1="93" y1="295" x2="93" y2="365"/>
        <line x1="106" y1="295" x2="106" y2="365"/>
        <line x1="119" y1="295" x2="119" y2="365"/>
        <line x1="132" y1="295" x2="132" y2="365"/>
        <line x1="145" y1="295" x2="145" y2="365"/>
        <line x1="158" y1="295" x2="158" y2="365"/>
        <line x1="171" y1="295" x2="171" y2="365"/>
        <line x1="184" y1="295" x2="184" y2="365"/>
      </g>
    </g>

    <!-- Accordion right side (keyboard) -->
    <g class="right-paw">
      <rect x="198" y="290" width="22" height="80" rx="4" fill="#C0392B" stroke="#8B2222" stroke-width="2"/>
      <rect x="198" y="290" width="22" height="10" rx="3" fill="#E74C3C" stroke="#8B2222" stroke-width="1.5"/>
      <rect x="198" y="360" width="22" height="10" rx="3" fill="#E74C3C" stroke="#8B2222" stroke-width="1.5"/>
      <!-- Keys on right side -->
      <rect x="200" y="305" width="18" height="4" rx="1" fill="#F5F0E0" stroke="#D4C9A0" stroke-width="0.5"/>
      <rect x="200" y="312" width="14" height="4" rx="1" fill="#D4C9A0" stroke="#C0B890" stroke-width="0.5"/>
      <rect x="200" y="318" width="18" height="4" rx="1" fill="#F5F0E0" stroke="#D4C9A0" stroke-width="0.5"/>
      <rect x="200" y="325" width="14" height="4" rx="1" fill="#D4C9A0" stroke="#C0B890" stroke-width="0.5"/>
      <rect x="200" y="332" width="18" height="4" rx="1" fill="#F5F0E0" stroke="#D4C9A0" stroke-width="0.5"/>
      <rect x="200" y="339" width="18" height="4" rx="1" fill="#F5F0E0" stroke="#D4C9A0" stroke-width="0.5"/>
      <rect x="200" y="346" width="14" height="4" rx="1" fill="#D4C9A0" stroke="#C0B890" stroke-width="0.5"/>
      <rect x="200" y="353" width="18" height="4" rx="1" fill="#F5F0E0" stroke="#D4C9A0" stroke-width="0.5"/>
    </g>

    <!-- Left paw (holding accordion left) -->
    <g class="left-paw">
      <ellipse cx="72" cy="375" rx="12" ry="8" fill="#D2B48C" stroke="#8B5E3C" stroke-width="1.5"/>
      <circle cx="66" cy="377" r="3" fill="#C4A77D" stroke="#8B5E3C" stroke-width="1"/>
      <circle cx="72" cy="378" r="3" fill="#C4A77D" stroke="#8B5E3C" stroke-width="1"/>
      <circle cx="78" cy="377" r="3" fill="#C4A77D" stroke="#8B5E3C" stroke-width="1"/>
    </g>

    <!-- Right paw (holding accordion right) -->
    <g class="right-paw">
      <ellipse cx="235" cy="375" rx="12" ry="8" fill="#D2B48C" stroke="#8B5E3C" stroke-width="1.5"/>
      <circle cx="229" cy="377" r="3" fill="#C4A77D" stroke="#8B5E3C" stroke-width="1"/>
      <circle cx="235" cy="378" r="3" fill="#C4A77D" stroke="#8B5E3C" stroke-width="1"/>
      <circle cx="241" cy="377" r="3" fill="#C4A77D" stroke="#8B5E3C" stroke-width="1"/>
    </g>

    <!-- Feet -->
    <ellipse cx="170" cy="398" rx="14" ry="7" fill="#C4A77D" stroke="#8B5E3C" stroke-width="1.5"/>
    <ellipse cx="230" cy="398" rx="14" ry="7" fill="#C4A77D" stroke="#8B5E3C" stroke-width="1.5"/>
    <!-- Toe lines -->
    <line x1="163" y1="398" x2="163" y2="402" stroke="#8B5E3C" stroke-width="0.8"/>
    <line x1="170" y1="398" x2="170" y2="402" stroke="#8B5E3C" stroke-width="0.8"/>
    <line x1="177" y1="398" x2="177" y2="402" stroke="#8B5E3C" stroke-width="0.8"/>
    <line x1="223" y1="398" x2="223" y2="402" stroke="#8B5E3C" stroke-width="0.8"/>
    <line x1="230" y1="398" x2="230" y2="402" stroke="#8B5E3C" stroke-width="0.8"/>
    <line x1="237" y1="398" x2="237" y2="402" stroke="#8B5E3C" stroke-width="0.8"/>
  </g>

  <!-- Musical notes floating -->
  <g fill="#5C3A1E" opacity="0.6">
    <g>
      <text x="250" y="250" font-size="20" font-family="serif">♪</text>
      <animateTransform attributeName="transform" type="translate" values="0,0; 8,-20; 0,-40" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0" dur="2.5s" repeatCount="indefinite"/>
    </g>
    <g>
      <text x="280" y="230" font-size="16" font-family="serif">♫</text>
      <animateTransform attributeName="transform" type="translate" values="0,0; 5,-15; 0,-35" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.25;0" dur="3s" repeatCount="indefinite"/>
    </g>
    <g>
      <text x="230" y="260" font-size="14" font-family="serif">♪</text>
      <animateTransform attributeName="transform" type="translate" values="0,0; -5,-12; 0,-30" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0" dur="2s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>