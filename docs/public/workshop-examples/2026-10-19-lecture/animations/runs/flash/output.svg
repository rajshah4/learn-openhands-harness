<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <style>
      @keyframes sway {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-3deg); }
        75% { transform: rotate(3deg); }
      }
      @keyframes bellows {
        0%, 100% { transform: scaleX(1); }
        50% { transform: scaleX(1.4); }
      }
      @keyframes pawLeft {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-8px, 2px); }
      }
      @keyframes pawRight {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(8px, 2px); }
      }
      @keyframes bodyBob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      .hedgehog-body {
        animation: sway 3s ease-in-out infinite;
        transform-origin: 200px 280px;
      }
      .bellow-anim {
        animation: bellows 1.2s ease-in-out infinite;
        transform-origin: 170px 210px;
      }
      .paw-left {
        animation: pawLeft 1.2s ease-in-out infinite;
      }
      .paw-right {
        animation: pawRight 1.2s ease-in-out infinite;
      }
      .bob-group {
        animation: bodyBob 1.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#e8f4e8" rx="20"/>

  <!-- Ground -->
  <ellipse cx="200" cy="340" rx="120" ry="15" fill="#c8d8a8" opacity="0.6"/>

  <g class="bob-group">
    <g class="hedgehog-body">
      <!-- Hedgehog body - main oval -->
      <ellipse cx="200" cy="270" rx="70" ry="55" fill="#8B6914"/>

      <!-- Spines - back layer -->
      <g fill="#5C4033">
        <polygon points="145,240 140,215 152,238"/>
        <polygon points="155,225 155,198 162,222"/>
        <polygon points="168,215 170,188 176,212"/>
        <polygon points="182,210 186,182 190,208"/>
        <polygon points="197,208 202,178 205,206"/>
        <polygon points="212,208 218,178 220,206"/>
        <polygon points="227,212 233,185 235,210"/>
        <polygon points="240,218 248,192 248,218"/>
        <polygon points="252,228 260,205 258,230"/>
        <polygon points="260,240 268,220 264,244"/>
      </g>

      <!-- Spines - middle layer -->
      <g fill="#6B4E2E">
        <polygon points="148,235 141,210 155,232"/>
        <polygon points="160,220 158,193 166,218"/>
        <polygon points="175,212 176,185 182,210"/>
        <polygon points="190,208 194,180 198,207"/>
        <polygon points="205,207 210,180 213,207"/>
        <polygon points="220,210 226,184 228,210"/>
        <polygon points="234,216 242,190 242,216"/>
        <polygon points="247,226 256,204 253,228"/>
      </g>

      <!-- Spines - top highlight -->
      <g fill="#A0783C">
        <polygon points="155,230 152,205 162,228"/>
        <polygon points="170,218 172,195 178,216"/>
        <polygon points="185,212 189,188 193,210"/>
        <polygon points="200,210 205,186 208,209"/>
        <polygon points="215,210 221,188 223,210"/>
        <polygon points="230,216 237,194 238,216"/>
        <polygon points="245,224 252,204 250,226"/>
      </g>

      <!-- Face / belly area -->
      <ellipse cx="200" cy="278" rx="50" ry="38" fill="#D4A96A"/>

      <!-- Belly -->
      <ellipse cx="200" cy="295" rx="38" ry="25" fill="#F0D8A8"/>

      <!-- Head -->
      <ellipse cx="185" cy="248" rx="28" ry="24" fill="#D4A96A"/>

      <!-- Ear -->
      <ellipse cx="172" cy="232" rx="8" ry="10" fill="#C49450"/>
      <ellipse cx="172" cy="232" rx="5" ry="6" fill="#E8C088"/>

      <!-- Eye -->
      <circle cx="178" cy="244" r="5" fill="#1a1a1a"/>
      <circle cx="180" cy="242" r="2" fill="white"/>

      <!-- Nose -->
      <ellipse cx="162" cy="250" rx="4" ry="3" fill="#1a1a1a"/>

      <!-- Mouth -->
      <path d="M165,255 Q172,260 178,256" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>

      <!-- Whiskers -->
      <g stroke="#8B6914" stroke-width="1" opacity="0.6">
        <line x1="158" y1="248" x2="140" y2="244"/>
        <line x1="158" y1="252" x2="138" y2="252"/>
        <line x1="158" y1="256" x2="142" y2="260"/>
      </g>

      <!-- Cheek blush -->
      <ellipse cx="170" cy="254" rx="6" ry="4" fill="#E8A080" opacity="0.5"/>

      <!-- Feet -->
      <ellipse cx="175" cy="322" rx="14" ry="7" fill="#8B6914"/>
      <ellipse cx="225" cy="322" rx="14" ry="7" fill="#8B6914"/>

      <!-- Accordion -->
      <g>
        <!-- Left keyboard/button side -->
        <rect x="140" y="200" width="30" height="65" rx="4" fill="#8B2252"/>
        <rect x="143" y="204" width="24" height="57" rx="3" fill="#A03060"/>

        <!-- Buttons on left side -->
        <g fill="#FFD700">
          <circle cx="155" cy="212" r="3"/>
          <circle cx="155" cy="224" r="3"/>
          <circle cx="155" cy="236" r="3"/>
          <circle cx="155" cy="248" r="3"/>
        </g>

        <!-- Right keyboard side -->
        <rect x="230" y="195" width="30" height="75" rx="4" fill="#8B2252"/>
        <rect x="233" y="199" width="24" height="67" rx="3" fill="#A03060"/>

        <!-- Keys on right -->
        <g fill="#F5F5DC">
          <rect x="235" y="204" width="18" height="6" rx="1"/>
          <rect x="235" y="214" width="18" height="6" rx="1"/>
          <rect x="235" y="224" width="18" height="6" rx="1"/>
          <rect x="235" y="234" width="18" height="6" rx="1"/>
          <rect x="235" y="244" width="18" height="6" rx="1"/>
          <rect x="235" y="254" width="18" height="6" rx="1"/>
        </g>

        <!-- Bellows -->
        <g class="bellow-anim">
          <polygon points="170,205 230,200 230,265 170,270" fill="#D0A050"/>
          <line x1="180" y1="203" x2="180" y2="268" stroke="#B08040" stroke-width="2"/>
          <line x1="190" y1="202" x2="190" y2="269" stroke="#B08040" stroke-width="2"/>
          <line x1="200" y1="201" x2="200" y2="268" stroke="#B08040" stroke-width="2"/>
          <line x1="210" y1="200" x2="210" y2="267" stroke="#B08040" stroke-width="2"/>
          <line x1="220" y1="200" x2="220" y2="266" stroke="#B08040" stroke-width="2"/>
          <!-- Bellows fold shading -->
          <polygon points="170,205 180,203 180,268 170,270" fill="#C89448" opacity="0.5"/>
          <polygon points="190,202 200,201 200,268 190,269" fill="#C89448" opacity="0.5"/>
          <polygon points="210,200 220,200 220,266 210,267" fill="#C89448" opacity="0.5"/>
        </g>

        <!-- Straps connecting to body -->
        <line x1="165" y1="200" x2="165" y2="275" stroke="#6B4E2E" stroke-width="3" opacity="0.5"/>
        <line x1="235" y1="195" x2="235" y2="275" stroke="#6B4E2E" stroke-width="3" opacity="0.5"/>
      </g>

      <!-- Left paw (on left side of accordion) -->
      <g class="paw-left">
        <ellipse cx="145" cy="245" rx="12" ry="15" fill="#D4A96A"/>
        <!-- Fingers -->
        <circle cx="138" cy="238" r="4" fill="#D4A96A"/>
        <circle cx="143" cy="234" r="4" fill="#D4A96A"/>
        <circle cx="149" cy="236" r="4" fill="#D4A96A"/>
        <circle cx="140" cy="252" r="4" fill="#D4A96A"/>
      </g>

      <!-- Right paw (on right side of accordion) -->
      <g class="paw-right">
        <ellipse cx="255" cy="240" rx="12" ry="15" fill="#D4A96A"/>
        <!-- Fingers -->
        <circle cx="250" cy="232" r="4" fill="#D4A96A"/>
        <circle cx="256" cy="230" r="4" fill="#D4A96A"/>
        <circle cx="262" cy="234" r="4" fill="#D4A96A"/>
        <circle cx="260" cy="248" r="4" fill="#D4A96A"/>
      </g>

      <!-- Small smile/music notes that float up -->
      <g fill="#555" opacity="0.6">
        <text x="260" y="180" font-size="14" font-family="serif">♪</text>
        <text x="280" y="160" font-size="12" font-family="serif">♫</text>
        <text x="245" y="155" font-size="11" font-family="serif">♪</text>
      </g>
    </g>
  </g>

  <!-- Simple flowers on ground -->
  <g opacity="0.5">
    <circle cx="140" cy="335" r="4" fill="#FF8899"/>
    <circle cx="270" cy="330" r="4" fill="#FFAA66"/>
    <circle cx="115" cy="330" r="3" fill="#FF8899"/>
    <circle cx="290" cy="338" r="3" fill="#FFAA66"/>
  </g>
</svg>