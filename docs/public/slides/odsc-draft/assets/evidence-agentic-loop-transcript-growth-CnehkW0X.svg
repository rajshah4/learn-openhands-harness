    <rect x="996" y="192" width="164" height="60" rx="6" fill="#BFD3FF"/>
    <rect x="1168" y="192" width="84" height="60" rx="6" fill="#BFD3FF"/>
    <rect x="1260" y="192" width="132" height="60" rx="6" fill="#2E70FF"/>
    <text x="860" y="332" font-size="26" font-weight="700" fill="#676358">TURN 3</text>
    <rect x="996" y="292" width="164" height="60" rx="6" fill="#BFD3FF"/>
    <rect x="1168" y="292" width="84" height="60" rx="6" fill="#BFD3FF"/>
    <rect x="1260" y="292" width="132" height="60" rx="6" fill="#BFD3FF"/>
    <rect x="1400" y="292" width="132" height="60" rx="6" fill="#2E70FF"/>
    <text x="860" y="432" font-size="26" font-weight="700" fill="#676358">TURN 4</text>
    <rect x="996" y="392" width="164" height="60" rx="6" fill="#BFD3FF"/>
    <rect x="1168" y="392" width="84" height="60" rx="6" fill="#BFD3FF"/>
    <rect x="1260" y="392" width="132" height="60" rx="6" fill="#BFD3FF"/>
    <rect x="1400" y="392" width="132" height="60" rx="6" fill="#BFD3FF"/>
    <rect x="1540" y="392" width="80" height="60" rx="6" fill="#2E70FF"/>
    <rect x="996" y="504" width="24" height="24" rx="4" fill="#BFD3FF"/>
