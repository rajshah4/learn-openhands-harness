    <path d="M310 176 H378" stroke="#676358" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M522 240 V364" stroke="#676358" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M390 456 H322" stroke="#676358" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M177 392 V252" stroke="#676358" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <rect x="40" y="112" width="270" height="128" rx="8" fill="#FFFFFF" stroke="#CCC6B6" stroke-width="2"/>
    <text x="68" y="148" font-size="20" font-weight="700" fill="#2E70FF">01</text>
    <text x="68" y="196" font-size="30" font-weight="700" fill="#20201E">User asks</text>
    <rect x="390" y="112" width="274" height="128" rx="8" fill="#20201E" stroke="#20201E" stroke-width="2"/>
    <text x="418" y="148" font-size="20" font-weight="700" fill="#9CB9FF">02</text>
    <text x="418" y="188" font-size="27" font-weight="700" fill="#F9F1D9">Model chooses</text>
    <text x="418" y="220" font-size="27" font-weight="700" fill="#F9F1D9">a tool</text>
