<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="680" viewBox="0 0 1660 680" role="img" aria-labelledby="skills-progressive-title skills-progressive-desc">
  <title id="skills-progressive-title">A skill loads instructions only when relevant</title>
  <desc id="skills-progressive-desc">A short catalog helps select a skill. Instructions and references load as needed; scripts can execute without loading their full source into context.</desc>
  <defs>
    <marker id="skills-arrow" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><path d="M0 0 L12 4 L0 8 Z" fill="#8B877B"/></marker>
    <marker id="skills-arrow-blue" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><path d="M0 0 L12 4 L0 8 Z" fill="#2E70FF"/></marker>
  </defs>
  <path d="M348 284 H456" stroke="#8B877B" stroke-width="4" fill="none" marker-end="url(#skills-arrow)"/>
  <path d="M856 284 H964" stroke="#2E70FF" stroke-width="4" fill="none" marker-end="url(#skills-arrow-blue)"/>
  <rect x="48" y="176" width="300" height="216" rx="12" fill="#F4EFE0" stroke="#CCC6B6" stroke-width="3"/>
  <text x="80" y="228" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#676358">TASK</text>
  <text x="80" y="292" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#20201E">Review this pull</text>
  <text x="80" y="336" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#20201E">request</text>
  <rect x="456" y="96" width="400" height="376" rx="12" fill="#FFFFFF" stroke="#CCC6B6" stroke-width="3"/>
  <text x="488" y="148" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#676358">SKILL CATALOG</text>
  <rect x="488" y="180" width="336" height="76" rx="8" fill="#EEF3FF" stroke="#2E70FF" stroke-width="3"/>
  <text x="512" y="212" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#20201E">PR review</text>
  <text x="512" y="240" font-family="Arial, sans-serif" font-size="19" fill="#676358">Inspect changes and cite evidence</text>
  <rect x="488" y="276" width="336" height="64" rx="8" fill="#F4EFE0" stroke="#CCC6B6" stroke-width="2"/>
  <text x="512" y="316" font-family="Arial, sans-serif" font-size="23" fill="#676358">PDF analysis</text>
  <rect x="488" y="360" width="336" height="64" rx="8" fill="#F4EFE0" stroke="#CCC6B6" stroke-width="2"/>
  <text x="512" y="400" font-family="Arial, sans-serif" font-size="23" fill="#676358">Release notes</text>
  <text x="656" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#676358">Only short descriptions are loaded</text>
  <rect x="964" y="96" width="648" height="456" rx="12" fill="#EEF3FF" stroke="#2E70FF" stroke-width="3"/>
  <text x="1000" y="148" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2E70FF">SELECTED SKILL</text>
  <rect x="1000" y="184" width="576" height="92" rx="8" fill="#FFFFFF" stroke="#AABBDD" stroke-width="2"/>
  <text x="1028" y="222" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#20201E">SKILL.md</text>
  <text x="1028" y="254" font-family="Arial, sans-serif" font-size="21" fill="#676358">Steps, constraints, and output format</text>
  <rect x="1000" y="300" width="272" height="92" rx="8" fill="#FFFFFF" stroke="#AABBDD" stroke-width="2"/>
  <text x="1028" y="338" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#20201E">references/</text>
  <text x="1028" y="370" font-family="Arial, sans-serif" font-size="21" fill="#676358">Loaded when needed</text>
  <rect x="1304" y="300" width="272" height="92" rx="8" fill="#FFFFFF" stroke="#AABBDD" stroke-width="2"/>
  <text x="1332" y="338" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#20201E">scripts/</text>
  <text x="1332" y="370" font-family="Arial, sans-serif" font-size="21" fill="#676358">Executed as tools</text>
  <text x="1288" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#20201E">Detailed procedure enters context now</text>
  <text x="48" y="628" font-family="Arial, sans-serif" font-size="24" fill="#676358">Progressive disclosure keeps unrelated procedures out of the prompt.</text>
</svg>
