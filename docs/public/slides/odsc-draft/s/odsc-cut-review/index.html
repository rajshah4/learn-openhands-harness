    <style>html{background-color:oklch(99% 0 0)}html.dark{background-color:oklch(14.5% 0 0)}</style>
    <script>
      // Apply the stored theme before first paint; next-themes only runs
      // after the bundle loads, which flashes white for dark-mode users.
      let stored = null;
      try {
        stored = localStorage.getItem('theme');
      } catch (_) {}
      const dark =
        stored === 'dark' ||
        (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    </script>
